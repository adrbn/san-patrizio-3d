syntax = "proto3";
package mps;

option go_package = "github.com/retroplasma/flyover-reverse-engineering/pkg/mps";

message ResourceManifest {
	repeated StyleConfig style_config = 2;
	string token_p2 = 30;

	// Historiquement la base URL des fichiers de cache (xml/altitude-*.xml)
	// etait ici, a la racine. Apple l'a depuis deplacee dans services.cache_base.
	// Conserve pour compatibilite avec les vieux manifestes.
	string cache_base_url = 31;

	repeated CacheFile cache_file = 72;
	repeated string cache_file_2 = 9;

	// Conteneur d'endpoints de service ajoute par Apple.
	Services services = 92;

	message Services {
		Endpoint cache_base = 2;

		message Endpoint {
			string url = 1;
		}
	}

	message CacheFile {
		string file_name = 2;
	}

	message StyleConfig {
		string url_prefix_1 = 1;
		string url_prefix_2 = 9;
		StyleID style_id = 3;

		enum StyleID {
			_ = 0;
			C3MM_1 = 14;
			C3M = 15;
			DTM_1 = 16;
			DTM_2 = 17;
			C3MM_2 = 52;
		}
	}	
}
